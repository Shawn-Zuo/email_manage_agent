<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>每日邮件助手</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6fa;color:#202b43;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1120px;margin:auto;padding:40px 28px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:36px}.brand{font-size:19px;font-weight:700}.badge{font-size:12px;background:#e3f5ee;color:#24735a;padding:6px 10px;border-radius:20px}h1{font-size:36px;letter-spacing:-1px;margin:12px 0}p{color:#69758c;line-height:1.8}.hero{display:flex;justify-content:space-between;gap:24px;align-items:center;margin-bottom:26px}.panel{background:white;border:1px solid #e5e8f0;border-radius:18px;padding:24px;margin:18px 0;box-shadow:0 5px 20px #1a294005}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}button,select{font:inherit;padding:11px 17px;border-radius:10px;border:1px solid #dfe4ee;background:white;color:#33415c;cursor:pointer}button.primary{background:#5368e8;color:white;border-color:#5368e8}button:disabled{opacity:.45;cursor:default}.muted{color:#8791a4;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.stat{padding:22px;background:white;border:1px solid #e5e8f0;border-radius:16px}.number{font-size:27px;font-weight:650;margin-top:12px}.status{display:flex;align-items:center;gap:10px}.dot{width:9px;height:9px;background:#94a1b8;border-radius:50%}.running .dot{background:#5368e8;animation:pulse 1s infinite}.error .dot{background:#d75c5c}.done .dot{background:#32a57c}@keyframes pulse{50%{opacity:.3}}pre{font-family:inherit;white-space:pre-wrap;word-break:break-word;line-height:1.85;margin:20px 0 0;font-size:14px;max-height:560px;overflow:auto}#empty{text-align:center;padding:48px 12px;color:#8b95a8}#error{color:#b34848}footer{font-size:12px;color:#8a93a4;margin-top:24px;line-height:1.8}@media(max-width:650px){.brand{font-size:16px;white-space:nowrap}.badge{display:none}.number{font-size:20px}header{gap:12px}.hero{display:block}.stats{gap:8px}.stat{padding:14px}h1{font-size:28px}main{padding:24px 16px}}
</style><main><header><div class="brand">✉ 每日邮件助手</div><div><span class="badge">仅本机访问</span> <button id="quit">退出应用</button></div></header>
<div class="hero"><div><div class="muted" id="date"></div><h1>把邮件，整理清楚。</h1><p>分类、摘要与待办，一次查看。支持最近 1–7 天，包含已读和未读邮件。</p></div></div>
<div class="panel"><div class="controls"><select id="days" aria-label="分析天数"><option value="1">当天</option><option value="2">最近 2 天（含今天）</option><option value="3">最近 3 天（含今天）</option><option value="4">最近 4 天（含今天）</option><option value="5">最近 5 天（含今天）</option><option value="6">最近 6 天（含今天）</option><option value="7">最近 7 天（含今天）</option></select><select id="limit" aria-label="分析范围"><option value="">所选范围全部邮件</option><option value="5">所选范围最新 5 封</option><option value="1">所选范围最新 1 封</option></select><button class="primary" id="start">开始分析</button><button id="stop" disabled>停止分析</button><span class="muted">上海时区 · 只读访问邮箱</span></div><p class="muted">点击后会读取已配置的邮箱，并将邮件正文发送给 DeepSeek 分析。结果仅保留在本次应用内存中。</p><div id="error" role="alert"></div></div>
<div class="stats"><div class="stat"><span class="muted">已读取邮件</span><div class="number" id="count">—</div></div><div class="stat"><span class="muted">分析进度</span><div class="number" id="progress">—</div></div><div class="stat"><span class="muted">运行状态</span><div class="number" id="state">待开始</div></div></div>
<div class="panel"><div class="status" id="status"><span class="dot"></span><strong>分析结果与每日汇总</strong></div><div id="empty">点击「开始分析」，查看所选范围的邮件摘要与待办。<br><small>不会标记已读，也不会移动或删除邮件。</small></div><pre id="output" aria-live="polite"></pre></div>
<footer>邮箱账号、IMAP 授权码和模型 Key 从本地 .env 读取，界面不会展示凭据。分析范围以所配置的邮箱文件夹为准。</footer></main>
<script>
const token=new URLSearchParams(location.search).get('token');
const $=id=>document.getElementById(id);
$('date').textContent=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',dateStyle:'full'}).format(new Date());
let closed=false;
async function api(path,body){let r=await fetch('/api/'+path+'?token='+encodeURIComponent(token),body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let data=await r.json();if(!r.ok)throw Error(data.error||'操作未完成');return data;}
async function poll(){if(closed)return;try{let s=await api('state'),text=s.lines.join('\n'),running=s.status==='running';$('output').textContent=text;$('empty').hidden=!!text||running;$('start').disabled=running;$('limit').disabled=running;$('days').disabled=running;$('stop').disabled=!running;$('state').textContent=({idle:'待开始',running:'分析中',done:'已完成',error:'已停止 / 失败'})[s.status];$('status').className='status '+s.status;let count=text.match(/共 (\d+) 封邮件/),progress=[...text.matchAll(/进度: (\d+)\/(\d+)/g)].pop();$('count').textContent=count?count[1]:text.includes('所选范围没有邮件')?'0':'—';$('progress').textContent=progress?progress[1]+' / '+progress[2]:'—';}catch(e){$('error').textContent='无法连接本地服务，请重新双击启动文件。';}if(!closed)setTimeout(poll,1000);}
$('start').onclick=async()=>{try{$('error').textContent='';$('start').disabled=true;await api('start',{limit:$('limit').value?Number($('limit').value):null,days:Number($('days').value)});}catch(e){$('error').textContent=e.message;$('start').disabled=false;}};
$('stop').onclick=async()=>{try{await api('stop',{});}catch(e){$('error').textContent=e.message;}};
$('quit').onclick=async()=>{try{await api('quit',{});closed=true;$('state').textContent='已退出';$('start').disabled=true;$('stop').disabled=true;$('error').textContent='应用已关闭，可以关闭此页面。';}catch(e){$('error').textContent=e.message;}};
poll();
</script></html>
